name: 每日新闻简报

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

jobs:
  send-news:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install -r daily-news/requirements.txt

      - name: 运行新闻简报
        env:
          SEND_KEY: ${{ secrets.SEND_KEY }}
        run: |
          cd daily-news
          python daily_news.py
